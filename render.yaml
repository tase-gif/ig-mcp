services:
  - type: web
    name: ig-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: python -m src.cloud_server
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_API_VERSION
        sync: false
